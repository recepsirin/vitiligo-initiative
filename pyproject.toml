[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vitiligo"
version = "1.0.0"
description = "Vitiligo Initiative — AI-native research engine for stopping spread and driving repigmentation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Vitiligo Initiative" }
]
keywords = ["vitiligo", "dermatology", "ai", "research", "knowledge-graph", "rag"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlmodel>=0.0.22",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "tenacity>=8.5",
    "lxml>=5.2",
    "numpy>=1.26",
    "fastembed>=0.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "anthropic>=0.39",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-lxml>=2024.4",
]

[project.scripts]
vitiligo = "vitiligo.cli:app"

[project.urls]
Repository = "https://github.com/recepsirin/vitiligo-initiative"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vitiligo = ["py.typed", "web/static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501", # line length is handled by formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: real SQLite on a seeded temp file (fast; runs in CI)",
    "corpus: requires the full local vitiligo.db corpus",
    "smoke: thin end-to-end checks over the full corpus (run locally)",
    "confidence: curated retrieval/trial scenarios on the minimal regression corpus (runs in CI)",
]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
