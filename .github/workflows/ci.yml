name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.cache/fastembed
      VITILIGO_REGRESSION_DB: /tmp/vitiligo-regression.db
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Cache fastembed ONNX model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/fastembed
          key: fastembed-${{ runner.os }}-bge-small-en-v1.5

      - name: Cache regression corpus
        id: regression-db
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/vitiligo-regression.db
          key: regression-${{ hashFiles('tests/fixtures/regression/**', 'scripts/test/build_regression_db.py') }}

      - name: Install package and dev tools
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests

      - name: Ruff format
        run: ruff format --check src tests

      - name: Pytest (unit + integration)
        run: pytest tests/ -q -m "not corpus and not smoke and not confidence"

      - name: Build regression corpus
        if: steps.regression-db.outputs.cache-hit != 'true'
        run: python scripts/test/build_regression_db.py --output "$VITILIGO_REGRESSION_DB"

      - name: Pytest (confidence regression)
        run: pytest tests/ -q -m confidence
