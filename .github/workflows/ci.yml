name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package and dev tools
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests

      - name: Pytest (unit + integration)
        run: pytest tests/ -q -m "not corpus and not smoke and not confidence"

      - name: Build regression corpus
        run: python scripts/test/build_regression_db.py --output /tmp/vitiligo-regression.db

      - name: Pytest (confidence regression)
        env:
          VITILIGO_REGRESSION_DB: /tmp/vitiligo-regression.db
        run: pytest tests/ -q -m confidence
