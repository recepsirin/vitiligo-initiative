name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.cache/fastembed
      VITILIGO_REGRESSION_DB: /tmp/vitiligo-regression.db
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Cache fastembed ONNX model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/fastembed
          key: fastembed-${{ runner.os }}-bge-small-en-v1.5

      - name: Cache regression corpus
        id: regression-db
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /tmp/vitiligo-regression.db
          key: regression-${{ hashFiles('tests/fixtures/regression/**', 'scripts/test/build_regression_db.py') }}

      - name: Install package and dev tools
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests

      - name: Ruff format
        run: ruff format --check src tests

      - name: Pytest (unit + integration)
        run: pytest tests/ -q -m "not corpus and not smoke and not confidence"

      - name: Build regression corpus
        if: steps.regression-db.outputs.cache-hit != 'true'
        run: python scripts/test/build_regression_db.py --output "$VITILIGO_REGRESSION_DB"

      - name: Pytest (confidence regression)
        run: pytest tests/ -q -m confidence
