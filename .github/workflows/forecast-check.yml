name: Forecast check

# Weekly: score the sealed forecasts in forecasts/ against results posted on
# ClinicalTrials.gov. Read-only: writes a table to the run summary, never
# commits or opens issues. No corpus or secrets needed.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        run: pip install -e .

      - name: Score sealed forecasts
        run: vitiligo discover check-forecasts forecasts --markdown "$GITHUB_STEP_SUMMARY"
