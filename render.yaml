# Render.com blueprint — optional public hosting (docs/deploy.md).
services:
  - type: web
    name: vitiligo-evidence-engine
    runtime: docker
    plan: starter
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: VITILIGO_WEB_HOST
        value: 0.0.0.0
      - key: VITILIGO_DB_PATH
        value: /var/data/vitiligo.db
      - key: FASTEMBED_CACHE_PATH
        value: /var/data/cache
      - key: VITILIGO_PREWARM_EMBEDDINGS
        value: "true"
      - key: VITILIGO_RATE_LIMIT_POST_PER_MINUTE
        value: "30"
      # Render terminates traffic at its proxy; key rate limits on the address that
      # proxy appends (right-most X-Forwarded-For entry). Raise only if more
      # proxies sit in front; too high a value lets clients spoof their IP.
      - key: VITILIGO_TRUSTED_PROXY_HOPS
        value: "1"
      # Global caps on the paid Ask/Hypothesize endpoints, across ALL clients.
      # Starting points: tune to your Anthropic budget (Hypothesize is roughly
      # 10-20k tokens per call). Also set a spend limit in the Anthropic console.
      - key: VITILIGO_LLM_REQUESTS_PER_MINUTE
        value: "10"
      - key: VITILIGO_LLM_DAILY_TOKEN_BUDGET
        value: "2000000"
      - key: LOG_LEVEL
        value: INFO
      - key: ANTHROPIC_API_KEY
        sync: false
    disk:
      name: vitiligo-data
      mountPath: /var/data
      sizeGB: 1
