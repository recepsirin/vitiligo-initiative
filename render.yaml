# Render.com blueprint — optional public hosting (docs/deploy.md).
services:
  - type: web
    name: vitiligo-evidence-engine
    runtime: docker
    # Free to start with. A free web service has no persistent disk, which is why
    # the Dockerfile bakes the corpus into the image, and it spins down after 15
    # minutes idle — the first visitor after that waits for a cold start. Free
    # also means no custom domain: the service is served at
    # <name>.onrender.com. 750 instance hours per workspace per month.
    #
    # For a deployment clinicians are pointed at, change to:
    #     plan: starter
    # and add back the volume, which mounts over the baked copy:
    #     disk:
    #       name: vitiligo-data
    #       mountPath: /var/data
    #       sizeGB: 3
    # with VITILIGO_DB_PATH and FASTEMBED_CACHE_PATH under /var/data. That stops
    # the spin-down, allows a custom domain, and makes refreshing the corpus an
    # upload rather than a rebuild of a ~1.1 GB image.
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: VITILIGO_WEB_HOST
        value: 0.0.0.0
      # Both default to /data in the image, where the corpus and the model are
      # baked; set them only when a volume is mounted somewhere else.
      - key: VITILIGO_DB_PATH
        value: /data/vitiligo.db
      - key: FASTEMBED_CACHE_PATH
        value: /data/cache
      - key: VITILIGO_PREWARM_EMBEDDINGS
        value: "true"
      - key: VITILIGO_RATE_LIMIT_POST_PER_MINUTE
        value: "30"
      # Render terminates traffic at its proxy; key rate limits on the address that
      # proxy appends (right-most X-Forwarded-For entry). Raise only if more
      # proxies sit in front; too high a value lets clients spoof their IP.
      - key: VITILIGO_TRUSTED_PROXY_HOPS
        value: "1"
      - key: LOG_LEVEL
        value: INFO
    # No API key of any kind: the engine answers from stored records and calls
    # no model API, so there is nothing to leak, meter or budget.
